name: dart_source_graph
description: >
  Generates a semantic dependency graph of Dart/Flutter source code.
  Identifies Widgets, Notifiers, Blocs and Controllers with confidence-rated
  edges. Designed for AI-assisted codebase analysis and architecture audits.
version: 0.1.2
repository: https://github.com/GuzCabQ/dartgraph
issue_tracker: https://github.com/GuzCabQ/dartgraph/issues

topics:
  - dart
  - flutter
  - static-analysis
  - ast
  - graph

executables:
  dart_source_graph:

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^13.0.0
  args: ^2.7.0
  crypto: ^3.0.7
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
